version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quickbite-db
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - quickbite-db-volume:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - quickbite-net

volumes:
  quickbite-db-volume:

networks:
  quickbite-net:
    driver: bridge
