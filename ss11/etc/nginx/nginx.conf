# Ex1
server {
    listen 80;
    server_name domain.com;

    location / {
        proxy_pass http://localhost:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# proxy_pass là chỉ thị quan trọng nhất dùng để cấu hình Reverse Proxy trong Nginx.
#
# Ý nghĩa: Chỉ thị này chỉ định Nginx đóng vai trò là một máy chủ trung gian.
# Khi Nginx nhận được yêu cầu (request) từ người dùng, proxy_pass sẽ báo cho
# Nginx biết cần phải chuyển tiếp (forward) yêu cầu đó đến một địa chỉ/máy chủ
# khác ở phía sau (backend) — trong trường hợp này là ứng dụng React tại http://localhost:3000.
# Khi backend xử lý xong, Nginx sẽ nhận lại kết quả và trả về cho người dùng.

# Nếu ứng dụng React ở port 3000 bị sập, Nginx sẽ trả về lỗi: 502 Bad Gateway.

# Giải thích thêm: Nginx ở port 80 vẫn đang sống và tiếp nhận request bình thường.
# Tuy nhiên, khi nó cố gắng làm nhiệm vụ của proxy là gửi request vào port 3000, nó không
# thể kết nối được vì ứng dụng React đã sập. Do Nginx (đóng vai trò Gateway) nhận được
# phản hồi không hợp lệ hoặc không kết nối được tới server đích, nó sẽ ném ra lỗi 502
# để báo cho người dùng biết sự cố này.


# Ex2
server {
    listen 80;
    server_name domain.com; # Thay domain.com bằng tên miền của bạn

    # 1. Định tuyến cho Backend (API Gateway)
    # Các request có đường dẫn bắt đầu bằng /api/ sẽ chui vào block này
    location /api/ {
        proxy_pass http://localhost:8080;

        # Giữ nguyên các header quan trọng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Định tuyến cho Frontend (React)
    # Các request còn lại (/, /about, /products,...) sẽ rơi vào block mặc định này
    location / {
        proxy_pass http://localhost:3000;

        # Giữ nguyên các header quan trọng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

#Tại sao phải truyền Header X-Forwarded-For?

# Mục đích của X-Forwarded-For là để lưu vết (trace) địa chỉ IP thực sự của người dùng
# cuối (client) xuyên suốt qua các lớp Proxy. API Gateway ở phía sau rất cần thông tin này
# để làm các nghiệp vụ như: ghi log, giới hạn lượng truy cập (rate limiting), chặn IP xấu,
# hoặc phân tích hành vi người dùng.

# Nếu không truyền, Backend sẽ thấy IP của ai?

# Nếu thiếu header này, Backend sẽ chỉ nhìn thấy IP của Nginx (vì Nginx là người trực tiếp gọi điện đến Backend).
# Trong tình huống hệ thống này, do Nginx và Backend chạy trên cùng một máy, Backend sẽ tưởng
# lầm rằng tất cả mọi request đều đến từ IP 127.0.0.1 (localhost).

# Ex3
# sudo apt update
# sudo apt install certbot python3-certbot-nginx -y
# sudo certbot --nginx -d api.my-ecommerce.com
# api.my-ecommerce.com là đường dẫn giả lâp. để lệnh chay được, bạn cần thay bằng tên miền thật của bạn.

# Block cấu hình cho HTTPS (Port 443)
server {
    listen 443 ssl;
    server_name api.my-ecommerce.com;

    # Trỏ tới file chứng chỉ SSL (Public Key)
    ssl_certificate /etc/letsencrypt/live/api.my-ecommerce.com/fullchain.pem;

    # Trỏ tới file Private Key
    ssl_certificate_key /etc/letsencrypt/live/api.my-ecommerce.com/privkey.pem;

    # Cấu hình bảo mật SSL nâng cao (Tùy chọn nhưng nên có)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:8080; # Chuyển request vào API Gateway hoặc Backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Block cấu hình để tự động chuyển hướng HTTP (80) sang HTTPS (443)
server {
    listen 80;
    server_name api.my-ecommerce.com;

    # Bắt buộc redirect toàn bộ traffic sang https
    return 301 https://$host$request_uri;
}

# Để chứng chỉ tự động gia hạn trước khi hết hạn 90 ngày,
# ta sẽ sử dụng công cụ đặt lịch trình là Cronjob (hoặc Systemd Timer).
# Lệnh thiết lập Cronjob:
# sudo crontab -e
# Thêm dòng sau vào cuối file Cronjob:
# 0 0,12 * * * certbot renew --quiet


# Ex4
server {
    listen 80;
    server_name my-ecommerce.com;

    # 1. Tăng giới hạn dung lượng file upload lên 10MB để sửa lỗi 413 Request Entity Too Large
    client_max_body_size 10M;

    # 2. Bật nén Gzip để tối ưu tốc độ tải các file tĩnh (HTML, CSS, JS)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024; # Chỉ nén các file có kích thước lớn hơn 1KB
    gzip_proxied any;
    gzip_comp_level 6;    # Mức độ nén (từ 1 đến 9, mức 6 là cân bằng tốt nhất giữa tốc độ và CPU)
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    location / {
        proxy_pass http://localhost:3000;
        # ... các cấu hình proxy_set_header khác
    }
}

# Lệnh nào nên gõ trước tiên để kiểm tra lỗi cú pháp file config?

# Trả lời: Trước khi chạy bất kỳ lệnh nào liên quan đến systemctl, bắt buộc phải gõ lệnh
# sudo nginx -t để kiểm tra xem file cấu hình có bị lỗi cú pháp hay không. Nếu có lỗi mà
# vẫn cố tình chạy lại Nginx, hệ thống có thể bị sập hoàn toàn.

# Trên production, dùng systemctl restart nginx hay systemctl reload nginx? Sự khác biệt
# chí mạng là gì?

# Lệnh nên dùng: Chỉ được phép sử dụng sudo systemctl reload nginx.

# Sự khác biệt chí mạng:

# restart (Khởi động lại hoàn toàn): Lệnh này sẽ giết chết ngay lập tức toàn bộ tiến
# trình Nginx cũ rồi mới khởi động tiến trình mới. Điều này dẫn đến downtime (thời gian chết).
# Các khách hàng đang online tải dở file hoặc đang gửi request sẽ bị rớt kết nối ngay lập
# tức (hiển thị lỗi trên trình duyệt).

# reload (Zero-downtime reload): Lệnh này hoạt động vô cùng tinh tế. Nó sẽ khởi tạo các tiến
# trình worker mới mang cấu hình mới để đón luồng khách hàng tiếp theo. Cùng lúc đó, các
# worker cũ vẫn tiếp tục sống để phục vụ nốt những request đang dở dang của khách hàng cũ.
# Khi xử lý xong xuôi, worker cũ mới tự động tắt (Graceful shutdown). Quá trình này diễn ra
# mượt mà và không làm gián đoạn trải nghiệm của bất kỳ khách hàng nào đang online.
