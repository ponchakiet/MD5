name: Restaurant Service CI
on: [push]

jobs:
  build:
    runs-on: [self-hosted, quickbite-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          cd restaurant-service
          chmod +x ./gradlew
          ./gradlew bootJar
